name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/portal-public-config

  worker-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/portal-public-config-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/portal-public-config-edge/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  container:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/ai-workspace-services/portal-public-config:sha-${{ github.sha }}
            ghcr.io/ai-workspace-services/portal-public-config:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Print image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          echo "IMAGE_REF=ghcr.io/ai-workspace-services/portal-public-config:sha-${{ github.sha }}@${{ steps.build.outputs.digest }}"

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: [worker-ts]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: portal-public-config-edge-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: workers/portal-public-config-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/portal-public-config-edge/package-lock.json
      - run: npm ci
      - name: Authenticate to Vault and fetch Cloudflare credentials
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-portal-public-config-prod
          jwtGithubAudience: vault
          secrets: |
            kv/data/prod/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/prod/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN
      - name: Deploy portal-public-config-edge to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy
      - name: Smoke-check live Worker endpoints
        run: |
          set -euo pipefail
          BASE_URL="https://portal-public-config-edge.manbuzhe2008.workers.dev"

          echo "Checking ${BASE_URL}/healthz"
          HEALTHZ=$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors --max-time 15 "${BASE_URL}/healthz")
          echo "HEALTHZ=${HEALTHZ}"
          echo "${HEALTHZ}" | grep -q '"runtime":"cloudflare-worker"'

          echo "Checking ${BASE_URL}/readyz"
          READYZ=$(curl -fsS --retry 6 --retry-delay 3 --retry-all-errors --max-time 15 "${BASE_URL}/readyz")
          echo "READYZ=${READYZ}"
          echo "${READYZ}" | grep -q '"status":"ready"'

          echo "Verifying retired ${BASE_URL}/api/auth/homepage-video returns 404"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${BASE_URL}/api/auth/homepage-video")
          echo "HOMEPAGE_VIDEO_STATUS=${STATUS}"
          [ "${STATUS}" = "404" ]
